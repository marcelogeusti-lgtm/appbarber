services:
  - type: web
    name: appbarber-server
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    plan: free
    region: oregon
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WHATSAPP_API_URL
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_INSTANCE_NAME
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
