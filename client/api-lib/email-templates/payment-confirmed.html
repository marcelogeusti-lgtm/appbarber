<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Confirmado - Next App</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, helvetica, arial, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            color: #ffffff;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #1e293b;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 40px 20px;
            text-align: center;
        }

        .content {
            padding: 40px 32px;
        }

        .footer {
            padding: 30px;
            background-color: #111827;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .greeting {
            font-size: 18px;
            color: #f8fafc;
            margin-bottom: 24px;
        }

        .card {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.1);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
        }

        .amount {
            font-size: 40px;
            font-weight: 800;
            color: #10b981;
            margin: 0 0 8px 0;
        }

        .description {
            font-size: 16px;
            color: #94a3b8;
            margin: 0;
        }

        .details {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 24px;
            margin-top: 24px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .detail-label {
            color: #94a3b8;
            font-weight: 500;
        }

        .detail-value {
            color: #f8fafc;
            font-weight: 600;
            text-align: right;
        }

        .footer p {
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="{{logoUrl}}" alt="Next App" height="40"
                style="display: block; margin: 0 auto; max-height: 40px; width: auto;">
        </div>
        <div class="content">
            <h2 style="color: #f8fafc; margin-top: 0; text-align: center;">Pagamento Recebido 💸</h2>
            <p class="greeting">Olá,</p>
            <p style="color: #cbd5e1; margin-bottom: 24px; line-height: 1.6;">Confirmamos o recebimento do seu pagamento
                com sucesso.</p>

            <div class="card">
                <p class="amount">R$ {{amount}}</p>
                <p class="description">{{description}}</p>
            </div>

            <div class="details">
                <div class="detail-row">
                    <span class="detail-label">Método de Pagamento:</span>
                    <span class="detail-value">{{paymentMethod}}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Identificador:</span>
                    <span class="detail-value" style="font-family: monospace;">{{transactionId}}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Data do Pagamento:</span>
                    <span class="detail-value">{{date}}</span>
                </div>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2026 Next App Cloud. Todos os direitos reservados.</p>
        </div>
    </div>
</body>

</html>
