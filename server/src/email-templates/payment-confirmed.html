<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Confirmado</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f5;
            margin: 0;
            padding: 0;
            color: #18181b;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: #10b981;
            padding: 32px;
            text-align: center;
            color: #ffffff;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .content {
            padding: 40px 32px;
        }

        .greeting {
            font-size: 18px;
            color: #3f3f46;
            margin-bottom: 24px;
        }

        .card {
            background-color: #ecfdf5;
            border: 1px solid #10b981;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            margin-bottom: 24px;
        }

        .amount {
            font-size: 36px;
            font-weight: 800;
            color: #065f46;
            margin: 0 0 8px 0;
        }

        .description {
            font-size: 16px;
            color: #047857;
            margin: 0;
        }

        .details {
            border-top: 1px solid #e5e7eb;
            padding-top: 24px;
            margin-top: 24px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .detail-label {
            color: #6b7280;
            font-weight: 500;
        }

        .detail-value {
            color: #111827;
            font-weight: 600;
            text-align: right;
        }

        .footer {
            background-color: #f9fafb;
            padding: 24px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }

        .footer p {
            margin: 0;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Pagamento Recebido 💸</h1>
        </div>
        <div class="content">
            <p class="greeting">Olá,</p>
            <p style="color: #4b5563; margin-bottom: 24px; line-height: 1.6;">Confirmamos o recebimento do seu pagamento
                com sucesso.</p>

            <div class="card">
                <p class="amount">R$ {{amount}}</p>
                <p class="description">{{description}}</p>
            </div>

            <div class="details">
                <div class="detail-row">
                    <span class="detail-label">Método de Pagamento:</span>
                    <span class="detail-value">{{paymentMethod}}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Identificador:</span>
                    <span class="detail-value" style="font-family: monospace;">{{transactionId}}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Data do Pagamento:</span>
                    <span class="detail-value">{{date}}</span>
                </div>
            </div>

        </div>
        <div class="footer">
            <p>AppBarber - Sistema de Gestão Inteligente para Barbearias.</p>
        </div>
    </div>
</body>

</html>
